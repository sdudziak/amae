services:
  db:
    image: mariadb:11
    container_name: ${PROJECT_NAME}-db
    environment:
      MYSQL_DATABASE: ${WP_DB_NAME}
      MYSQL_USER: ${WP_DB_USER}
      MYSQL_PASSWORD: ${WP_DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${WP_DB_ROOT_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -uroot -p$${MYSQL_ROOT_PASSWORD} -h 127.0.0.1 --silent"]
      interval: 10s
      timeout: 5s
      retries: 10

  wordpress:
      build:
        context: ../..
        dockerfile: ops/docker/Dockerfile.wordpress
      container_name: ${PROJECT_NAME}-wp
      working_dir: /var/www/web
      depends_on:
        db:
          condition: service_healthy
      environment:
        # Bedrock DB vars (loaded by bedrock/config via .env)
        DB_NAME: ${WP_DB_NAME}
        DB_USER: ${WP_DB_USER}
        DB_PASSWORD: ${WP_DB_PASSWORD}
        DB_HOST: db:3306
        WP_ENVIRONMENT_TYPE: local
        WP_HOME: http://localhost:8080
        WP_SITEURL: http://localhost:8080/wp
        WORDPRESS_CONFIG_EXTRA: |
          // Hardening & dev logs
          define('DISALLOW_FILE_EDIT', true);
          define('WP_DEBUG', true);
          define('WP_DEBUG_LOG', true);
          define('WP_DEBUG_DISPLAY', true);
          define('WP_MEMORY_LIMIT', '256M');
          ini_set('display_errors', 1);
          ini_set('display_startup_errors', 1);
          error_reporting(E_ALL);
          if (!defined('PROTECTED_PATH')) { define('PROTECTED_PATH', '/var/www/protected'); }
      volumes:
        - ../../bedrock:/var/www
        - vendor_data:/var/www/vendor
        - ../php/logging.ini:/usr/local/etc/php/conf.d/logging.ini
      user: "1000:1000"

  nginx:
    image: nginx:1.27-alpine
    container_name: ${PROJECT_NAME}-nginx
    depends_on:
      - wordpress
    ports:
      - "8080:80"
    volumes:
      - ../../bedrock:/var/www:ro
      - ../nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

  phpmyadmin:
    image: phpmyadmin:5
    container_name: ${PROJECT_NAME}-pma
    depends_on:
      - db
    ports:
      - "8081:80"
    environment:
      PMA_HOST: db
      PMA_USER: ${WP_DB_USER}
      PMA_PASSWORD: ${WP_DB_PASSWORD}

volumes:
  db_data:
  vendor_data:
